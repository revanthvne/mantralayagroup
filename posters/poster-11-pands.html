<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1000px;height:1500px;overflow:hidden;position:relative;font-family:'Montserrat',sans-serif;background:#150B07;color:#fff;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:34px 48px 0}

.hdr .co{font-size:19px;font-weight:800;letter-spacing:4px;color:rgba(255,255,255,0.75)}
.rule{height:5px;background:linear-gradient(105deg,#A80B0B 0%,#D83000 46%,#F07800 100%);position:absolute;top:0;left:0;right:0}
.label{font-size:19px;font-weight:800;letter-spacing:8px;color:#F6921E}
.cap{font-family:'Playfair Display',serif;font-weight:800;line-height:1.1;letter-spacing:-0.5px}
.grid-bg{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:64px 64px;pointer-events:none}
.glow{position:absolute;width:70%;height:60%;border-radius:50%;background:radial-gradient(circle,rgba(216,60,0,0.18),transparent 65%);top:-10%;right:-10%;filter:blur(50px);pointer-events:none}
.ftr{margin-top:auto;background:#0C0605;padding:16px 48px;display:flex;justify-content:space-between;align-items:center;font-family:'Inter',sans-serif;font-size:16px;font-weight:600;color:rgba(255,255,255,0.85)}
.ftr b{color:#F6921E}
</style></head><body><style>
.coll{position:absolute;inset:0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}
.coll img{width:100%;height:100%;object-fit:cover}
.coll::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,8,6,0.85),rgba(13,8,6,0.45) 40%,rgba(13,8,6,0.92) 78%,#0D0806)}
.hdr,.bt{position:relative;z-index:2}
.bt{margin-top:auto;padding:0 52px 52px;text-align:center}
.cap2{font-size:76px}
.cap2 em{background:linear-gradient(100deg,#FF6A2B,#F6921E 60%,#FFC46B);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.sub{margin-top:16px;font-family:'Inter',sans-serif;font-size:27px;font-weight:500;color:rgba(255,255,255,0.85)}
.pill{display:inline-block;margin-top:30px;background:linear-gradient(105deg,#A80B0B 0%,#D83000 46%,#F07800 100%);border-radius:100px;padding:22px 54px;font-size:31px;font-weight:800;letter-spacing:1px;box-shadow:0 14px 40px rgba(216,60,0,0.5)}
