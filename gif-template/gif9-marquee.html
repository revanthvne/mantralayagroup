<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:'Mont';src:url('file:///tmp/Montserrat.ttf');font-weight:100 900;}
@font-face{font-family:'Play';src:url('file:///tmp/Playfair.ttf');font-weight:400 900;}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:640px;height:640px;overflow:hidden;font-family:'Mont',sans-serif;background:#F6E9D2;position:relative;}
/* rotating sunburst — 24 spokes, rotates 15deg per 4s cycle = seamless */
.burst{position:absolute;left:50%;top:50%;width:1400px;height:1400px;margin:-700px 0 0 -700px;
  background:repeating-conic-gradient(#F0DFC0 0deg 7.5deg,#F6E9D2 7.5deg 15deg);
  animation:spin 4s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(15deg)}}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
/* marquee board */
.marq{background:#B3222A;border-radius:22px;padding:34px 38px 30px;position:relative;
  box-shadow:0 14px 40px rgba(80,30,10,.35), inset 0 0 0 6px #8E1B22;}
.bulbs{position:absolute;inset:10px;border-radius:16px;pointer-events:none;}
.b{position:absolute;width:11px;height:11px;border-radius:50%;background:#FFE9A8;
  box-shadow:0 0 8px #FFD24D,0 0 16px rgba(255,190,60,.8);animation:bl 1s infinite;}
.b.off{animation-delay:.5s;}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.25;box-shadow:none;background:#C9A25A;}}
.now{font-size:19px;font-weight:800;letter-spacing:6px;color:#FFE9A8;text-align:center;}
.title{font-family:'Play',serif;font-weight:900;font-size:52px;color:#FFF6E4;text-align:center;line-height:1.08;margin-top:10px;
  text-shadow:0 3px 0 #7D151C;}
.sub{font-size:20px;font-weight:700;letter-spacing:2px;color:#FFD24D;text-align:center;margin-top:12px;}
/* ticket stub */
.ticket{background:#FFF6E4;border:3px dashed #B3222A;border-radius:14px;padding:14px 30px;text-align:center;
  color:#7D151C;transform:rotate(-2deg);box-shadow:0 8px 22px rgba(80,30,10,.25);
  animation:tick 4s ease-in-out infinite;}
@keyframes tick{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-7px)}}
.ticket .adm{font-size:15px;font-weight:800;letter-spacing:4px;}
.ticket .st{font-size:27px;font-weight:900;margin-top:3px;}
.ticket .dt{font-size:16px;font-weight:700;margin-top:3px;letter-spacing:1px;}
.logoline{display:flex;align-items:center;gap:12px;background:#FFF6E4;border-radius:40px;padding:8px 22px;
  box-shadow:0 6px 18px rgba(80,30,10,.2);}
.logoline img{height:44px;}
.logoline span{font-size:17px;font-weight:800;color:#7D151C;letter-spacing:1px;}
</style></head><body>
<div class="burst"></div>
<div class="wrap">
  <div class="marq">
    <div class="bulbs" id="bulbs"></div>
    <div class="now">★ NOW SHOWING ★</div>
    <div class="title">MANTRALAYA<br>GROUP</div>
    <div class="sub">LIVE AT HIPLEX 2026</div>
  </div>
  <div class="ticket">
    <div class="adm">ADMIT&nbsp;EVERYONE</div>
    <div class="st">STALLS C 05 &amp; C 06 · HALL 4</div>
    <div class="dt">7–10 AUGUST · HITEX, HYDERABAD</div>
  </div>
  <div class="logoline"><img src="../mg-logo.png"><span>SEE YOU AT THE SHOW</span></div>
</div>
<script>
// place bulbs around marquee border, alternating phase for chase effect
const bx=document.getElementById('bulbs');
const W=bx.clientWidth,H=bx.clientHeight,step=34;let i=0;
function add(x,y){const d=document.createElement('div');d.className='b'+(i++%2?' off':'');d.style.left=(x-5)+'px';d.style.top=(y-5)+'px';bx.appendChild(d);}
for(let x=0;x<=W;x+=step)add(x,0);
for(let y=step;y<=H;y+=step)add(W,y);
for(let x=W-step;x>=0;x-=step)add(x,H);
for(let y=H-step;y>=step;y-=step)add(0,y);
</script>
</body></html>
